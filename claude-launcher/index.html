<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Claude Launcher</title>
<style>
  /* Black = transparent on additive glasses displays. */
  html, body { margin:0; height:100%; background:#000; color:#f2f2f2;
    font:24px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { min-height:100%; padding:14px; display:flex; flex-direction:column; gap:10px; }
  h1 { margin:0 0 2px; font-size:1.1em; color:#7CFFB2; }
  p { margin:0 0 4px; color:#8a8a8a; font-size:.7em; }
  a { display:block; text-decoration:none; color:#f2f2f2; background:#161616; border:2px solid #2a2a2a;
      border-radius:16px; padding:16px 18px; min-height:56px; }
  a.main { background:#7CFFB2; color:#000; border-color:#7CFFB2; font-weight:700; }
  a.sel, a:focus-visible, a:active { outline:4px solid #fff; outline-offset:2px; }
  a.sel::before { content:"▶ "; color:#7CFFB2; }
  a.main.sel::before { color:#000; }
  #dbg { margin-top:auto; color:#8a8a8a; font-size:.55em; }
  small { display:block; font-weight:400; font-size:.65em; opacity:.75; }
</style>
</head>
<body>
<main>
  <h1>Claude</h1>
  <p>Opens the real claude.ai. Sign in there once; it remembers you.</p>
  <a class="item main" href="https://claude.ai/new">💬 New chat<small>Dictate with the mic button in Claude</small></a>
  <a class="item" href="https://claude.ai/recents">🕘 Past chats</a>
  <a class="item" href="https://claude.ai/projects">📁 Projects</a>
  <a class="item" href="https://claude.ai/artifacts">🧩 Artifacts</a>
  <a class="item" href="https://claude.ai/code">⌨ Claude Code sessions</a>
  <a class="item" href="https://claude.ai/settings/profile">⚙ Settings &amp; memory</a>
  <div id="dbg">Scroll to move, pinch to select. Last input: none yet</div>
</main>
<script>
(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll(".item")), sel = 0, last = 0, wheelAt = 0;
  var dbg = document.getElementById("dbg");
  function note(t) { dbg.textContent = "Last input: " + t; }
  function show() {
    items.forEach(function (el, i) { el.classList.toggle("sel", i === sel); });
    items[sel].focus({ preventScroll: true });
    items[sel].scrollIntoView({ block: "nearest" });
  }
  function move(d) { sel = Math.max(0, Math.min(items.length - 1, sel + d)); show(); }
  function go() {
    var now = Date.now(); if (now - last < 800) return; last = now;
    var url = items[sel].href; dbg.textContent = "Opening " + items[sel].textContent.trim().split("\n")[0] + "…";
    try { window.location.assign(url); } catch (e) { window.open(url, "_self"); }
  }
  document.addEventListener("keydown", function (e) {
    var k = e.key; note("key " + k);
    if (k === "ArrowDown" || k === "PageDown" || (k === "Tab" && !e.shiftKey)) { e.preventDefault(); move(1); }
    else if (k === "ArrowUp" || k === "PageUp" || (k === "Tab" && e.shiftKey)) { e.preventDefault(); move(-1); }
    else if (k === "Enter" || k === " " || k === "Spacebar" || k === "ArrowRight" || k === "Select" || k === "NumpadEnter" || k === "GoBack" && false) { e.preventDefault(); go(); }
  }, true);
  document.addEventListener("wheel", function (e) {
    note("scroll " + (e.deltaY > 0 ? "down" : "up")); e.preventDefault();
    var t = Date.now(); if (t - wheelAt < 250) return; wheelAt = t; move(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  items.forEach(function (el, i) {
    el.addEventListener("click", function (e) { e.preventDefault(); note("click"); sel = i; show(); go(); });
    el.addEventListener("pointerup", function () { note("tap"); sel = i; show(); go(); });
    el.addEventListener("touchend", function (e) { e.preventDefault(); note("touch"); sel = i; show(); go(); });
  });
  // a select/pinch that lands on the page rather than a button opens the highlighted one
  document.addEventListener("click", function (e) { if (!e.target.closest || !e.target.closest(".item")) { note("click (page)"); go(); } });
  window.addEventListener("pageshow", function () { last = 0; show(); });
  show();
})();
</script>
</body>
</html>
