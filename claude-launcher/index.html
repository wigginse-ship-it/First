<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Claude Launcher</title>
<style>
  /* Black = transparent on additive glasses displays. */
  html, body { margin:0; height:100%; background:#000; color:#f2f2f2;
    font:24px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { min-height:100%; padding:14px; display:flex; flex-direction:column; gap:10px; }
  h1 { margin:0 0 2px; font-size:1.1em; color:#7CFFB2; }
  p { margin:0 0 4px; color:#8a8a8a; font-size:.7em; }
  a { display:block; text-decoration:none; color:#f2f2f2; background:#161616; border:2px solid #2a2a2a;
      border-radius:16px; padding:16px 18px; min-height:56px; }
  a.main { background:#7CFFB2; color:#000; border-color:#7CFFB2; font-weight:700; }
  a:focus-visible, a:active { outline:3px solid #7CFFB2; outline-offset:2px; }
  small { display:block; font-weight:400; font-size:.65em; opacity:.75; }
</style>
</head>
<body>
<main>
  <h1>Claude</h1>
  <p>Opens the real claude.ai. Sign in there once; it remembers you.</p>
  <a class="main" href="https://claude.ai/new">💬 New chat<small>Dictate with the mic button in Claude</small></a>
  <a href="https://claude.ai/recents">🕘 Past chats</a>
  <a href="https://claude.ai/projects">📁 Projects</a>
  <a href="https://claude.ai/artifacts">🧩 Artifacts</a>
  <a href="https://claude.ai/code">⌨ Claude Code sessions</a>
  <a href="https://claude.ai/settings/profile">⚙ Settings &amp; memory</a>
</main>
</body>
</html>
