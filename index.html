<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Apps</title>
<style>
  :root{--fg:#f2f2f2;--dim:#8a8a8a;--accent:#7CD4FF;--line:#2a2a2a;--btn:#161616}
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:var(--fg);font:24px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{padding:14px;max-width:640px;margin:0 auto}
  h1{font-size:1em;color:var(--accent);margin:0 0 12px}
  a{display:block;color:var(--fg);background:var(--btn);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none}
  a:focus,a:active{outline:3px solid var(--accent);outline-offset:1px}
  small{display:block;color:var(--dim);font-size:.65em}
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <a href="snow-forecast/">❄ Snow Forecast<small>Daily snow outlook, California, the West, maps</small></a>
  <a href="glasses-claude/">Claude for Glasses<small>Ask Claude</small></a>
  <a href="claude-launcher/">Claude Launcher</a>
  <a href="short-stack/">Short Stack</a>
  <a href="shadow-road/">Shadow Road</a>
</main>
</body>
</html>
