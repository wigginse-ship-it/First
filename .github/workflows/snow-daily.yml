name: Tomer Snow daily update

on:
  schedule:
    - cron: "17 13,19 * * *"   # twice daily (UTC) to catch the morning post
  push:
    branches: [claude/happy-fermat-kpuzeu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch latest forecast
        working-directory: snow-forecast
        run: node fetch.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }   # whole repo: each folder is served at /<repo>/<folder>/
      - id: deployment
        uses: actions/deploy-pages@v4
